* { box-sizing:border-box; } html, body, #root { min-height:100%; margin:0; } body { color:var(--center-ink); background:var(--center-bg); font-family:var(--center-ui); }
.center-app { min-height:100vh; padding:54px clamp(24px, 5vw, 82px) 70px; background:radial-gradient(circle at 92% 8%, rgba(110,192,238,.27) 0 0, transparent 24%), linear-gradient(130deg, #f5f9fd 0%, #eef4fa 58%, #e1ebf5 100%); }.center-header { display:flex; justify-content:space-between; gap:32px; max-width:1510px; margin:0 auto; }.center-header > div:first-child > span { color:var(--center-blue); font-size:12px; font-weight:820; letter-spacing:.18em; }.center-header h1 { margin:9px 0 10px; font-family:"Songti SC", "STSong", serif; font-size:44px; letter-spacing:-.045em; }.center-header p { margin:0; color:var(--center-muted); font-size:16px; }.center-status { align-self:flex-start; margin-top:12px; padding:9px 13px; border:1px solid #cfdae8; border-radius:999px; color:#267054; background:rgba(255,255,255,.62); font-size:13px; }.center-flow { display:flex; align-items:center; gap:14px; max-width:1510px; margin:34px auto 26px; padding:16px 20px; border:1px solid #dbe4ee; border-radius:12px; color:#55647e; background:rgba(255,255,255,.65); font-size:13px; }.center-flow span:first-child { color:#1b4d9f; font-weight:750; }.center-flow i { width:36px; height:1px; background:#b6c7d9; }
.center-layout { display:grid; grid-template-columns:minmax(330px, .78fr) minmax(0, 1.22fr); gap:24px; max-width:1510px; margin:0 auto; }.center-form, .center-templates { border:1px solid #d9e3ee; border-radius:16px; background:rgba(255,255,255,.88); box-shadow:0 16px 40px rgba(47,77,112,.08); }.center-form { padding:22px; }.form-intro, .templates-title { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; }.form-intro b, .templates-title b { display:block; font-size:16px; }.form-intro span, .templates-title span { display:block; margin-top:5px; color:var(--center-muted); font-size:12px; }.form-grid { display:grid; gap:12px; margin-top:18px; }.form-grid--small { grid-template-columns:1fr 1fr; }.center-field { display:grid; gap:6px; }.center-field span { color:#536078; font-size:12px; }.center-field input { width:100%; min-height:37px; padding:8px 10px; border:1px solid #d6e0ec; border-radius:8px; outline:none; color:#1f3155; background:#fbfdff; font:13px var(--center-ui); }.center-field input:focus { border-color:#4f88d8; box-shadow:0 0 0 3px rgba(79,136,216,.12); }.center-field input[type="color"] { padding:3px; }.form-divider { height:1px; margin:18px 0; background:#e4ebf3; }.upload-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }.center-upload { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:39px; padding:7px 9px; border:1px dashed #b9c8d9; border-radius:8px; color:#536078; font-size:12px; cursor:pointer; }.center-upload b { color:#2d70bd; font-size:11px; }.center-upload input { display:none; }.center-reset { width:100%; margin-top:18px; padding:10px; border:1px solid #d6e0ec; border-radius:8px; color:#60708b; background:#f8fbfe; font:600 12px var(--center-ui); cursor:pointer; }

lute; inset:0; opacity:.68; background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px); background-size:18px 18px; }.card-star .template-thumb > * { z-index:1; }.card-boost .template-thumb { color:#05225a; background:linear-gradient(145deg,#73e5ee,#219ed5); }.card-boost .template-thumb::after { content:"+"; position:absolute; right:-16px; top:-28px; color:rgba(255,255,255,.43); font-size:160px; font-weight:900; }.card-info .template-thumb { background:linear-gradient(145deg,#274f9a,#071947); }.card-info .template-thumb::before { content:""; position:absolute; right:18px; top:28px; width:60px; height:77px; border:3px solid #fff; background:rgba(255,255,255,.22); }.card-ink .template-thumb { color:#254b55; background:radial-gradient(ellipse at 0% 0%,rgba(102,160,151,.54),transparent 42%),#f6f0df; }.card-ink .template-thumb::after { content:"印"; position:absolute; right:18px; top:18px; display:grid; place-items:center; width:44px; height:44px; border:2px solid #a74c40; border-radius:50%; color:#a74c40; font-family:"Songti SC",serif; }.card-paper .template-thumb { color:#171717; background:repeating-linear-gradient(0deg,rgba(0,0,0,.04) 0 1px,transparent 1px 9px),#f3efe5; }.card-paper .template-thumb::after { content:"精选"; position:absolute; right:16px; top:17px; padding:6px; color:#fff; background:#a22620; font-size:11px; }.card-board .template-thumb { color:#1d4b76; background:linear-gradient(145deg,#98d9ef,#3e9cd0); }.card-board .template-thumb::after { content:""; position:absolute; left:calc(50% - 37px); top:-8px; width:74px; height:22px; border:6px solid #c7d8dc; border-radius:0 0 9px 9px; background:#8ca5ab; }

@media (max-width:1050px) { .center-layout { grid-template-columns:1fr; }.template-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }

.editor-heading { display:flex; justify-content:space-between; gap:10px; margin-bottom:14px; }.editor-heading b { display:block; font-size:16px; }.editor-heading span { display:block; margin-top:4px; color:rgba(255,255,255,.58); font-size:11px; line-height:1.45; }.editor-heading a { color:#8be2ff; font-size:12px; white-space:nowrap; text-decoration:none; }
.editor-field { display:grid; gap:5px; margin:0 0 10px; }.editor-field > span { color:rgba(255,255,255,.73); font-size:12px; }.editor-field input, .editor-field textarea { width:100%; padding:8px 9px; border:1px solid rgba(255,255,255,.18); border-radius:7px; outline:none; color:#fff; background:rgba(255,255,255,.08); font:13px var(--ui); }.editor-field textarea { min-height:58px; resize:vertical; }.editor-field input[type="color"] { height:34px; padding:3px; }.editor-color-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }.editor-tip { margin:3px 0 10px; color:rgba(255,255,255,.53); font-size:11px; line-height:1.5; }.editor-upload { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:7px; color:rgba(255,255,255,.78); font-size:12px; }.editor-upload input { width:180px; color:rgba(255,255,255,.7); font-size:11px; }.editor-reset { width:100%; margin-top:7px; padding:9px; border:1px solid rgba(255,255,255,.22); border-radius:7px; color:#fff; background:rgba(255,255,255,.08); font:600 12px var(--ui); cursor:pointer; }
body.capture .editor-toggle, body.capture .editor-panel, body.capture .export-control { display:none; }
@media (max-width:700px) { .editor-panel { width:min(342px, calc(100vw - 36px)); } }

// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Exports (to window): Stage, Sprite, PlaybackBar, TextSprite, ImageSprite, RectSprite,
//   useTime, useTimeline, useSprite, Easing, interpolate, animate, clamp.
//
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// <Stage> auto-scales to the viewport and provides the scrubber, play/pause,
// ←/→ seek, space, and 0-to-reset controls, and persists the playhead.
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook. Use Easing + interpolate()/animate()
// for tweens; TextSprite / ImageSprite / RectSprite have built-in entry/exit.
// Build YOUR scenes by composing Sprites inside a Stage.
//
// Export: a Stage is recordable to a real .mp4 by gen-video (see the
// export-as-video built-in skill). Loading the page with ?capture (or passing
// <Stage capture>) strips the scrubber/letterboxing and renders one exact frame
// per seek, and the Stage registers a stable window.__animStage bridge
// (setTime/setPlaying/duration/...) that the exporter drives frame-by-frame.
/* END USAGE */
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;

};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

const useTimeline = () => React.useContext(TimelineContext);

//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {

  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,

  exitDur = 0.4,

  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />

function detectCapture(prop) {

    const params = new URLSearchParams(window.location.search);
    if (!params.has('capture')) return false;
    const v = params.get('capture');

function Stage({

  height = 720,

  autoplay = true,

    if (captureMode) return 0; // deterministic: ignore persisted playhead

      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(captureMode ? false : autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead (skipped in capture mode)

    if (captureMode) return;
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey, captureMode]);

    if (captureMode) { setScale(1); return; }
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44; // playback bar height
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };

  // Expose a stable-identity window.__animStage so the gen-video exporter can
  // seek/pause/measure. Dynamic values are read through a ref so the object
  // never has to be re-created. Backward-compatible with any setTime/duration
  // bridge (the exporter needs only setTime/setPlaying/duration).
  const bridgeStateRef = React.useRef(null);
  bridgeStateRef.current = { time, duration, fps, width, height, captureMode, setTime, setPlaying };

    const s = bridgeStateRef;

      version: 1,
      ready: true,
      get captureActive() { return s.current.captureMode; },
      get playing() { return s.current.playing; },
      setTime: (t) => s.current.setTime(clamp(t, 0, s.current.duration)),
      setPlaying: (p) => s.current.setPlaying(!!p),
      getTime: () => s.current.time,
      get duration() { return s.current.duration; },
      get fps() { return s.current.fps; },
      get width() { return s.current.width; },
      get height() { return s.current.height; },

    return () => { if (window.__animStage === bridge) delete window.__animStage; };

    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }

      });

    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);

    };

    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();

      } else if (e.code === 'ArrowLeft') {

      } else if (e.code === 'ArrowRight') {

      }

    return () => window.removeEventListener('keydown', onKey);

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: captureMode ? 'transparent' : '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}

        flex: 1,
        width: '100%',
        display: 'flex',
        alignItems: captureMode ? 'flex-start' : 'center',
        justifyContent: captureMode ? 'flex-start' : 'center',
        overflow: captureMode ? 'visible' : 'hidden',

            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: captureMode ? 'none' : '0 20px 60px rgba(0,0,0,0.4)',

          time={displayTime}

          duration={duration}
          playing={playing}
          onPlayPause={() => setPlaying(p => !p)}
          onReset={() => { setTime(0); }}
          onSeek={(t) => setTime(t)}
          onHover={(t) => setHoverTime(t)}

  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div data-stage-chrome style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',

          background: 'rgba(255,255,255,0.12)',

        }}/>
        <div style={{

        <div style={{

        width: 64, textAlign: 'left',
        color: 'rgba(246,244,239,0.55)',
      }}>
        {fmt(duration)}
      </div>
    </div>
  );
}

      return;
    }

    const previousTime = stage.getTime();
    const shouldResume = stage.playing;
    let started = false;
    let captureFrame = null;

    try {
      setState({ working: true, percent: 0, message: "正在准备原始 1080×1920 画布…" });
      stage.setPlaying(false);
      VideoTemplateStore.save(data);
      captureFrame = await createNativeCaptureFrame();
      const { sourceWindow, sourceDocument, videoCanvas } = captureFrame;
      const sourceStage = sourceWindow.__animStage;
      await waitForMedia(videoCanvas);

      const renderCanvas = document.createElement("canvas");
      renderCanvas.width = EXPORT_WIDTH;
      renderCanvas.height = EXPORT_HEIGHT;
      const context = renderCanvas.getContext("2d", { alpha: false });
      if (!context) throw new Error("浏览器无法创建视频画布。");

      const { Output, Mp4OutputFormat, BufferTarget, CanvasSource } = window.Mediabunny;
      const target = new BufferTarget();
      const output = new Output({ format: new Mp4OutputFormat({ fastStart: "in-memory" }), target });
      const source = new CanvasSource(renderCanvas, { codec: "avc", bitrate: 6500000, bitrateMode: "variable" });
      output.addVideoTrack(source, { frameRate: EXPORT_FPS });
      await output.start();
      started = true;

      const duration = sourceStage.duration;
      const totalFrames = Math.round(duration * EXPORT_FPS);
      for (let frame = 0; frame < totalFrames; frame += 1) {
        const timestamp = frame / EXPORT_FPS;
        sourceStage.setTime(timestamp);
        await new Promise((next) => sourceWindow.requestAnimationFrame(() => sourceWindow.requestAnimationFrame(next)));
        const captured = await window.html2canvas(videoCanvas, {
          backgroundColor: null,
          scale: 1,
          width: EXPORT_WIDTH,
          height: EXPORT_HEIGHT,
          windowWidth: EXPORT_WIDTH,
          windowHeight: EXPORT_HEIGHT,
          useCORS: true,
          allowTaint: false,
          logging: false,
        });
        context.fillStyle = "#091845";
        context.fillRect(0, 0, EXPORT_WIDTH, EXPORT_HEIGHT);
        context.drawImage(captured, 0, 0, EXPORT_WIDTH, EXPORT_HEIGHT);
        await source.add(timestamp, 1 / EXPORT_FPS, { keyFrame: frame === 0 || frame % (EXPORT_FPS * 3) === 0 });
        setState({ working: true, percent: Math.round(((frame + 1) / totalFrames) * 100), message: `正在生成原始尺寸 MP4 · ${frame + 1}/${totalFrames} 帧` });
      }

      setState({ working: true, percent: 100, message: "正在封装 MP4 文件…" });
      await output.finalize();
      started = false;
      if (!target.buffer) throw new Error("MP4 文件生成失败，请重试。");
      saveBlob(new Blob([target.buffer], { type: "video/mp4" }), exportFileName(data.eventName));
      setState({ working: false, percent: 100, message: "MP4 已开始下载（无声版）。" });
    } catch (error) {
      console.error("MP4 导出失败", error);
      setState({ working: false, percent: 0, message: `导出失败：${error && error.message ? error.message : "请使用最新版 Chrome 或 Edge 重试。"}` });
    } finally {
      if (started) { try { /* 编码初始化未完成时，无需强行封装文件。 */ } catch {} }
      if (captureFrame && captureFrame.frame) captureFrame.frame.remove();
      stage.setTime(previousTime);
      stage.setPlaying(shouldResume);
    }
  };

  return <aside className="export-control" data-html2canvas-ignore="true">
    <button className="export-button" disabled={state.working} onClick={exportMp4}>{state.working ? `生成中 ${state.percent}%` : "导出 MP4"}</button>
    <p className={`export-status ${state.message ? "is-visible" : ""}`} aria-live="polite">{state.message || "导出 1080×1920 无声视频"}</p>
  </aside>;
}

  { id: "paper", file: "报纸公告.html", name: "报纸公告", use: "精选赛事、政策解读", mark: "NOTICE" },
  { id: "board", file: "蓝色夹板.html", name: "蓝色夹板", use: "国际赛事、课程/报名说明", mark: "PROGRAM" },
];

function TextField({ label, value, onChange, type = "text" }) {
  return <label className="center-field"><span>{label}</span><input type={type} value={value} onChange={(event) => onChange(event.target.value)}></input></label>;
}

function cleanNoticeLine(value) {
  return String(value || "").replace(/^[\s\uFE0F•▪▫📣📅⏰💻📚🏆🔥📌👇🥇🥈🥉🌟]+/u, "").replace(/\s+/g, " ").trim();
}

function limitNoticeValue(value, length = 58) {
  const clean = cleanNoticeLine(value).replace(/[。；;]+$/, "");
  return clean.length > length ? `${clean.slice(0, length - 1)}…` : clean;
}

function extractNoticeData(source, fallback) {
  const lines = String(source || "").split(/\n+/).map(cleanNoticeLine).filter(Boolean);
  const findIndex = (pattern) => lines.findIndex((line) => pattern.test(line));
  const valueAt = (index, maxFollowing = 2) => {
    if (index < 0) return "";
    const current = lines[index];
    const colon = current.search(/[：:]/);
    if (colon >= 0 && current.slice(colon + 1).trim()) return limitNoticeValue(current.slice(colon + 1));
    if (!/(?:时间|信息|比例|设置|对象|年级|形式|方式|费用|级别|题量|时长)$/.test(current)) return limitNoticeValue(current);
    const following = [];
    for (let offset = 1; offset <= maxFollowing; offset += 1) {
      const next = lines[index + offset];
      if (!next || /^(报名|正式活动|初选|复选|全国|模拟|活动信息|获奖|奖项|参赛|费用|题量|时长|形式|级别)[：:]/.test(next) || /(?:时间|信息|比例|设置)$/.test(next)) break;
      following.push(next);
    }
    return limitNoticeValue(following.join("；"));
  };
  const valueFor = (pattern, maxFollowing = 2) => valueAt(findIndex(pattern), maxFollowing);
  const firstValue = (...patterns) => {
    for (const pattern of patterns) {
      const value = valueFor(pattern);
      if (value) return value;
    }
    return "";
  };
  const point = (label, value) => value ? `${label}：${limitNoticeValue(value)}` : "";

  const titleLine = lines.find((line) => line.length <= 70 && /(报名开启|开始报名|开放报名|活动|竞赛|比赛|选拔|测评|杯)/.test(line) && !/^(报名|活动时间|考试时间|参赛对象|考试形式|活动形式|获奖|奖项)/.test(line));
  const eventName = titleLine ? limitNoticeValue(titleLine.split(/[｜|]/)[0].replace(/(?:现已|正在)?(?:开放|开始)?报名.*$/, "").replace(/^[【\[]|[】\]]$/g, ""), 34) : "";
  const deadline = firstValue(/(?:报名截止|截止报名|报名时间)/);
  const eventDate = firstValue(/(?:正式活动|活动日期|考试日期|考试时间|初选时间|复选时间|总评选)/);
  const activityTime = firstValue(/(?:各年级)?(?:活动|考试)时间/);
  const debugTime = firstValue(/(?:模拟调试|调试时间|试运行)/);
  const form = firstValue(/(?:活动形式|考试形式|考试方式|活动方式|^形式[：:])/);
  const level = firstValue(/(?:级别|Level\s*\d)/i);
  const grade = firstValue(/(?:参赛对象|参赛年级|适合.*年级|面向.*年级|参加对象)/);
  const fee = firstValue(/(?:报名费|活动费|费用|收费)/);
  const questionCount = firstValue(/(?:题量|题目|共\s*\d+\s*题)/);
  const duration = firstValue(/(?:时长|用时|\d+\s*分钟)/);

  const awardIndex = findIndex(/(?:获奖比例|奖项设置|奖项)/);
  const awardRows = awardIndex >= 0 ? lines.slice(awardIndex + 1, awardIndex + 6).filter((line) => /(?:奖|\d+%|优胜)/.test(line)) : [];
  const awards = limitNoticeValue(awardRows.join(" · "), 62);
  const formatDetail = [form, questionCount && `题量${questionCount}`, duration && `时长${duration}`].filter(Boolean).join(" · ");
  const audienceDetail = [grade, fee && `费用${fee}`].filter(Boolean).join(" · ");
  const candidates = [
    point("报名截止", deadline),
    point("正式活动", eventDate),
    point("活动时间", activityTime),
    point("活动形式", formatDetail),
    point("参赛信息", audienceDetail),
    point("模拟调试", debugTime),
    point("奖项设置", awards),
  ].filter(Boolean);
  const changes = [];
  if (eventName) changes.push("赛事名");
  if (form || level) changes.push("副标题");
  if (awards) changes.push("宣传卖点");
  if (candidates.length) changes.push(`${Math.min(candidates.length, 5)} 条赛事要点`);

  return {
    data: {
      ...fallback,
      ...(eventName ? { eventName } : {}),
      ...(form || level ? { subtitle: [form, level].filter(Boolean).join(" · ") } : {}),
      ...(awards ? { sellingPoint: `获奖比例 · ${awards}` } : {}),
      ...(candidates.length ? { points: [...candidates, ...fallback.points].slice(0, 5) } : {}),
    },
    changes,
  };
}

function TemplateCenterApp() {
  const [data, setData] = useState(() => VideoTemplateStore.load());
  const [saved, setSaved] = useState(false);
  const [notice, setNotice] = useState("");
  const [importStatus, setImportStatus] = useState("");
  const update = (key, value) => setData((current) => ({ ...current, [key]: value }));
  const updatePoint = (index, value) => setData((current) => ({ ...current, points: current.points.map((point, currentIndex) => currentIndex === index ? value : point) }));
  const updateImage = async (key, file) => {
    if (!file) return;
    const source = await VideoTemplateStore.readFile(file);
    setData((current) => ({ ...current, images: { ...current.images, [key]: source } }));
  };
  const importNotice = () => {
    if (!notice.trim()) { setImportStatus("先粘贴一段赛事通知，再开始提取。"); return; }
    const extracted = extractNoticeData(notice, data);
    if (!extracted.changes.length) { setImportStatus("暂未识别到常见赛事字段，请检查通知内容后重试。"); return; }
    setData(extracted.data);
    setImportStatus(`已自动填入：${extracted.changes.join("、")}。你可以继续微调。`);
  };
  useEffect(() => { try { VideoTemplateStore.save(data); setSaved(true); const timeout = setTimeout(() => setSaved(false), 1300); return () => clearTimeout(timeout); } catch (error) { console.warn("资料保存失败，请缩小图片后重试。", error); } }, [data]);
  return <main className="center-app">
    <header className="center-header"><div><span>VIDEO TEMPLATE KIT</span><h1>赛事招生短视频模板中心</h1><p>填写一份资料，选择一套版式，生成 1080 × 1920 / 约 8 秒的发布视频。</p></div><div className="center-status">{saved ? "已自动保存" : "资料已就绪"}</div></header>
    <section className="center-flow"><span>01 填赛事资料</span><i></i><span>02 选视频模板</span><i></i><span>03 预览并导出 MP4</span></section>
    <div className="center-layout"><section className="center-form"><div className="form-intro"><b>统一赛事资料</b><span>以下内容将同步用于 8 套模板</span></div>
      <section className="notice-import"><div className="notice-import-head"><div><b>粘贴赛事通知，自动填入</b><span>识别赛事名、时间、年级、形式、费用与奖项</span></div><em>本地识别</em></div><textarea value={notice} onChange={(event) => setNotice(event.target.value)} placeholder="把家长群、公众号或活动通知整段复制到这里…"></textarea><div className="notice-import-actions"><button onClick={importNotice}>一键提取并填入</button><button className="notice-clear" onClick={() => { setNotice(""); setImportStatus(""); }}>清空</button></div>{importStatus && <p className="notice-import-status">{importStatus}</p>}</section>
      <div className="form-grid"><TextField label="赛事名" value={data.eventName} onChange={(value) => update("eventName", value)}></TextField><TextField label="副标题" value={data.subtitle} onChange={(value) => update("subtitle", value)}></TextField><TextField label="宣传卖点" value={data.sellingPoint} onChange={(value) => update("sellingPoint", value)}></TextField>{data.points.map((point, index) => <TextField key={index} label={`要点 ${index + 1}`} value={point} onChange={(value) => updatePoint(index, value)}></TextField>)}</div>
      <div className="form-divider"></div><div className="form-grid form-grid--small"><TextField label="账号名" value={data.accountName} onChange={(value) => update("accountName", value)}></TextField><TextField label="背景音乐名称" value={data.musicName} onChange={(value) => update("musicName", value)}></TextField><TextField label="品牌主色" type="color" value={data.brandPrimary} onChange={(value) => update("brandPrimary", value)}></TextField><TextField label="品牌辅色" type="color" value={data.brandSecondary} onChange={(value) => update("brandSecondary", value)}></TextField></div>
      <div className="form-divider"></div><div className="upload-grid">{[["poster", "赛事海报"], ["medal", "奖牌"], ["certificate", "证书"], ["activity", "活动现场图"]].map(([key, label]) => <label className="center-upload" key={key}><span>{label}</span><b>{data.images[key] ? "已添加" : "添加图片"}</b><input type="file" accept="image/*" onChange={(event) => updateImage(key, event.target.files && event.target.files[0])}></input></label>)}</div>
      <button className="center-reset" onClick={() => setData(VideoTemplateStore.reset())}>恢复默认资料</button>
    </section>
    <section className="center-templates"><div className="templates-title"><div><b>选择视频模板</b><span>八套均为实际 8 秒动效模板</span></div><small>点击即可预览</small></div><div className="template-grid">{templateCards.map((card) => <a className={`template-card card-${card.id}`} href={`?template=${card.id}`} key={card.id}><div className="template-thumb"><span>{card.mark}</span><b>{data.eventName}</b><i>{data.sellingPoint}</i></div><div className="template-meta"><b>{card.name}</b><span>{card.use}</span></div></a>)}</div></section>
  </div>
  </main>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<TemplateCenterApp></TemplateCenterApp>);

      }
    </script>
  </body>
</html>
